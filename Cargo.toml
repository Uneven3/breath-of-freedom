[package]
name = "breath-of-freedom"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[dependencies]
avian3d = { workspace = true }
bevy = { workspace = true }
bof_domain = { package = "breath_of_freedom_domain", path = "crates/domain" }
bof_simulation = { package = "breath_of_freedom_simulation", path = "crates/simulation" }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
dev = ["bevy/dynamic_linking"]
