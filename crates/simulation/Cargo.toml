[package]
name = "breath_of_freedom_simulation"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "bof_simulation"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[dependencies]
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel", "xpbd_joints"] }
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_log = "0.19"
bevy_math = "0.19"
bevy_time = "0.19"
bevy_transform = "0.19"
bof_domain = { package = "breath_of_freedom_domain", path = "../domain" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Vuelca el grafo de sistemas (`mod scheduling_audit`). Dev-dep a propósito: lo
# que este crate tiene prohibido declarar son dev-deps *suyas*, así que no
# entran al árbol de acá, y el binario del juego no lo ve nunca.
#
# Ojo al describirlo: `simulation_has_no_render_dependencies` lee este archivo
# como texto plano, comentarios incluidos, así que nombrar acá los crates
# prohibidos rompe el test aunque nadie los declare. Pasó al escribir esta
# misma línea.
bevy_mod_debugdump = { version = "0.16", default-features = false }
# Sin `debug` los nombres de sistema del grafo salen como placeholders, así que
# el volcado no serviría para leer el orden. Declararlo acá lo enciende para los
# tests y no para el juego, que es donde cuesta.
bevy_ecs = { version = "0.19", features = ["debug"] }
